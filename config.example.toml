# ==============================================================================
# Zen Sound — Базовая конфигурация (config.example.toml)
# Скопируйте этот файл в config.toml и заполните ваши параметры
# ==============================================================================

[app]
# Язык интерфейса: "ru" | "en"
language = "ru"

# Активная тема оформления (имя файла из папки themes/ без расширения)
# Доступно: "braun-80s", "cyberdeck", "gameboy", "industrial"
active_theme = "braun-80s"

# Режим отображения по умолчанию:
# "handheld" — вертикальный карманный плеер (для мобилок и компактного десктопа)
# "mini"     — горизонтальный виджет (отлично для работы поверх всех окон)
# "full"     — полный двухколоночный плеер со списком треков
form_factor = "handheld"

# Закреплять окно поверх всех других окон на ПК (удобно для виджета "mini")
always_on_top = false

# ==============================================================================
# Аудиопараметры
# ==============================================================================
[audio]
# Стартовая громкость в процентах (0 - 100)
default_volume = 75

# Размер буфера предзагрузки в миллисекундах (1000 - 5000)
buffer_size_ms = 2000

# Выравнивание громкости (ReplayGain): "off", "track", "album"
replaygain = "track"

# Плавный переход между треками (Crossfade) в миллисекундах (0 = отключено)
crossfade_ms = 0

# ==============================================================================
# Настройки изолированного кэша
# ==============================================================================
[cache]
# Путь к локальному каталогу кэша (по умолчанию папка cache/ рядом с плеером)
storage_dir = "./cache"

# Максимальный общий объем кэша для всей музыки в Гигабайтах (GB)
max_storage_gb = 10

# Приоритет воспроизведения: если трек закеширован — играть с диска без интернета
offline_first = true

# Скачивать в кэш только при подключении к Wi-Fi (экономия мобильного трафика)
wifi_only_caching = true

# Автоматически кэшировать последние прослушанные треки в фоне
smart_auto_cache = true

# ==============================================================================
# 1. Домашний сервер (Self-hosted Subsonic / Navidrome / Jellyfin)
# ==============================================================================
[services.subsonic]
enabled = true
# Локальный адрес вашего домашнего сервера
server_url = "http://192.168.1.45:4533"
username = "admin"
# Пароль или MD5-salt токен
token = ""

# Криптохэш для защищенного P2P-подключения извне (Iroh / WireGuard-tunnel)
# Позволяет подключаться к домашнему ПК из сети без белого IP и проброса портов
p2p_tunnel_hash = ""

# Автообнаружение сервера в домашней сети Wi-Fi через mDNS / Zeroconf
mdns_autodiscovery = true

# ==============================================================================
# 2. Яндекс Музыка
# ==============================================================================
[services.yandex]
enabled = false
# OAuth-токен аккаунта Яндекс
oauth_token = ""
# Предпочитаемое качество аудио: "mp3_192" | "mp3_320" | "flac"
preferred_quality = "mp3_320"

# ==============================================================================
# 3. Spotify
# ==============================================================================
[services.spotify]
enabled = false
client_id = ""
client_secret = ""
refresh_token = ""

# ==============================================================================
# 4. VK Музыка
# ==============================================================================
[services.vk]
enabled = false
# Токен доступа VK (Kate / User Access Token)
access_token = ""
user_id = ""
